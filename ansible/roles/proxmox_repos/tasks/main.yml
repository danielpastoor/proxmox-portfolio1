---
# ============================================================
# Role: proxmox_repos
# Vervangt: update-repos.sh
# ============================================================

- name: Enterprise PVE repo uitschakelen
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    insertbefore: "^Types:"
    line: "Enabled: no"
    state: present
  when: ansible_facts.files is defined

- name: Enterprise Ceph repo uitschakelen
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/ceph.sources
    insertbefore: "^Types:"
    line: "Enabled: no"
    state: present
  ignore_errors: true

- name: No-subscription PVE repo instellen
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: No-subscription Ceph repo instellen
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph-no-subscription.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/ceph-squid
      Suites: trixie
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: APT cache vernieuwen en systeem updaten
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
