---
# ============================================================
# Ansible inventory — Proxmox Portfolio 2425
# ============================================================

all:
  children:
    # Proxmox hypervisor node(s)
    proxmox_nodes:
      hosts:
        pve1:
          ansible_host: 10.24.39.2 # <-- vul hier het IP van jouw Proxmox node in
          ansible_user: root

    # Monitoring server (LXC container 150)
    monitoring:
      hosts:
        netdata-parent:
          ansible_host: "{{ monitoring.ip }}"
          ansible_user: root
          proxmox_ctid: "{{ monitoring.ct_id }}"
          ansible_ssh_common_args: "-o ProxyJump=root@10.24.39.2"

    # LXC WordPress containers (200-202)
    lxc_wordpress:
      hosts:
        wordpress-1:
          ansible_host: "10.24.39.20"
          ansible_user: root
          proxmox_ctid: 200
          ansible_ssh_common_args: "-o ProxyJump=root@10.24.39.2"
        wordpress-2:
          ansible_host: "10.24.39.21"
          ansible_user: root
          proxmox_ctid: 201
          ansible_ssh_common_args: "-o ProxyJump=root@10.24.39.2"
        wordpress-3:
          ansible_host: "10.24.39.22"
          ansible_user: root
          proxmox_ctid: 202
          ansible_ssh_common_args: "-o ProxyJump=root@10.24.39.2"

    # WordPress VMs (300-302)
    vm_wordpress:
      hosts:
        wordpress-vm-1:
          ansible_host: "10.24.39.30"
          ansible_user: root
        wordpress-vm-2:
          ansible_host: "10.24.39.31"
          ansible_user: root
        wordpress-vm-3:
          ansible_host: "10.24.39.32"
          ansible_user: root

    # Groep voor alle WordPress hosts
    wordpress_all:
      children:
        lxc_wordpress: {}
        vm_wordpress: {}
