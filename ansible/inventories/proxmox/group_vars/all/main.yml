---
# ============================================================
# Centrale configuratie
# ============================================================

network:
  gateway: "10.24.39.1"
  bridge: "vmbr0"
  subnet_prefix: "24"
  dns: "8.8.8.8"
  ip_base: "10.24.39"

proxmox:
  storage: "rbd"
  snippet_dir: "/var/lib/vz/snippets"
  cloud_image_path: "/var/lib/vz/template/iso/debian-13-cloud.qcow2"
  cloud_image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
  lxc_template: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
  ssh_key_path: "/root/.ssh/id_ed25519"
  other_nodes:
    - "10.24.39.3"
    - "10.24.39.4"

lxc:
  ct_id_start: 200
  ip_start: 20            # containers krijgen IPs: .20, .21, .22, ...
  count: 3                # voor meer of minder containers, pas hier aan
  memory: 1024            # MB
  cores: 1
  disk_size: 30           # GB
  network_rate: 50        # Mbps


vm:
  vm_id_start: 300
  ip_start: 30            # VMs krijgen IPs: .30, .31, .32, ...
  count: 3                # voor meer of minder VMs, pas hier aan
  memory: 1024            # MB
  cores: 1
  disk_size: "30G"
  network_rate: 50        # Mbps

monitoring:
  ct_id: 150
  ip: "10.24.39.15"
  port: 19999
  netdata_api_key: "11111111-2222-3333-4444-555555555555"

wordpress:
  db_name: "wordpress"
  db_user: "wpuser"
  install_dir: "/var/www/html/wordpress"
  # Wachtwoord komt uit vault (zie group_vars/all/vault.yml)
  db_password: "{{ vault_wp_db_password }}"

ssh_keys_dir: "/root/portfolio1/ssh-keys"

# Root wachtwoorden (LXC + VM) komt uit vault (zie group_vars/all/vault.yml)
lxc_root_password: "{{ vault_lxc_root_password }}"
vm_root_password: "{{ vault_vm_root_password }}"
proxmox_api_password: "{{ vault_proxmox_api_password }}"

# Expliciete lijsten (Maak op basis van waarden hierboven)
lxc_containers:
  - { index: 1, ctid: 200, ip: "10.24.39.20", hostname: "wordpress-1" }
  - { index: 2, ctid: 201, ip: "10.24.39.21", hostname: "wordpress-2" }
  - { index: 3, ctid: 202, ip: "10.24.39.22", hostname: "wordpress-3" }

vm_containers:
  - { index: 1, vmid: 300, ip: "10.24.39.30", hostname: "wordpress-vm-1" }
  - { index: 2, vmid: 301, ip: "10.24.39.31", hostname: "wordpress-vm-2" }
  - { index: 3, vmid: 302, ip: "10.24.39.32", hostname: "wordpress-vm-3" }
